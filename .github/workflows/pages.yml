# APPROVED EXCEPTION to the org "max 2 workflow files per repo" rule.
# This is the 3rd workflow file (alongside ci.yml + publish.yml): a dedicated
# GitHub Pages docs-site deploy. It is explicitly approved because the Pages
# deploy requires its own `pages: write` + `id-token: write` permissions and a
# `github-pages` environment that must not be merged into the CI or publish
# workflows. Keep it separate; do not fold into ci.yml/publish.yml.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Lifecycle scripts stay off: this job inherits workflow-level id-token:write.
      # astro build is an explicit later step, not an install hook.
      - name: Install site dependencies
        working-directory: site
        run: npm ci --ignore-scripts

      - name: Build site
        working-directory: site
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
