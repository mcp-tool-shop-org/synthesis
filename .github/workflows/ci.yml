name: CI

on:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "data/**"
      - "schemas/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/**"
  # NOT paths-gated, and it must stay that way. All three jobs below publish
  # REQUIRED status checks on main. A paths filter that skips this workflow
  # produces no check run at all, so branch protection waits on a report that
  # will never come and the PR is BLOCKED with no exit but --admin. site/** is
  # not in the push list above and never was, so every Dependabot PR against the
  # handbook -- #14 through #19 on 2026-09-17, six of them -- received exactly
  # zero checks and sat unmergeable. To skip work on a PR, gate inside a job
  # with `if:`: a skipped job still reports, and protection counts a skipped
  # required check as passing. This repo is public; Actions minutes are free.
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Verify (test + build + eval + report schema)
      run: npm run verify

    - name: Check eval_report schema gold instances
      run: npm run check:report-schema

    - name: Eval planted-RED pack
      run: npm run eval:planted

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Use Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check TypeScript compilation
      run: npm run build
