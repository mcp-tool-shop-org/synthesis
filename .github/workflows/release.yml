name: Release (npm via Trusted Publishing)

# Publishes @mcptoolshop/synthesis to npm via OIDC Trusted Publishing (no long-lived
# token). The npm Trusted Publisher is bound to THIS workflow file name (release.yml) for
# repo mcp-tool-shop-org/synthesis — the OIDC subject must match, so do not rename this file
# without updating the npm Trusted Publisher config.

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm Trusted Publishing (OIDC, tokenless) requires npm >= 11.5.0; node 22 ships npm 10.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      # Lifecycle scripts stay off while this job holds id-token:write. Verify and
      # prepublishOnly (tsc) run as explicit later steps, not as install hooks.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts
          fi

      - name: Verify (test + build + eval)
        run: npm run verify

      - name: Assert package version matches GitHub release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::package.json version ($PKG) does not match release tag ($TAG)"
            exit 1
          fi

      # Tokenless publish via Trusted Publishing — npm uses the OIDC id-token automatically
      # and attaches provenance. No NPM_TOKEN secret is involved.
      # GitHub pre-releases and semver prerelease versions must not land on latest.
      - name: Publish to npm (Trusted Publishing)
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').version")"
          if [ "${RELEASE_PRERELEASE}" = "true" ] || [[ "$PKG" == *-* ]]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
