name: Release (npm via Trusted Publishing)

# Publishes @mcptoolshop/synthesis to npm via OIDC Trusted Publishing (no long-lived
# token). The npm Trusted Publisher is bound to THIS workflow file name (release.yml) for
# repo mcp-tool-shop-org/synthesis — the OIDC subject must match, so do not rename this file
# without updating the npm Trusted Publisher config.

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm Trusted Publishing (OIDC, tokenless) requires npm >= 11.5.0; node 22 ships npm 10.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - run: npm run build --if-present

      - run: npm test --if-present

      # Tokenless publish via Trusted Publishing — npm uses the OIDC id-token automatically
      # and attaches provenance. No NPM_TOKEN secret is involved.
      - name: Publish to npm (Trusted Publishing)
        run: npm publish --provenance --access public
